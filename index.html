<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Budget Tracker</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="hero">
        <div>
          <p class="eyebrow">Vanilla JS Project</p>
          <h1>Expense / Budget Tracker</h1>
          <p>Gestionează venituri, cheltuieli, buget lunar și filtrează tranzacțiile.</p>
        </div>
        <button id="clear-all" class="danger secondary">Șterge tot</button>
      </section>

      <section class="cards">
        <article class="card"><span>Venituri</span><strong id="income-total">0 RON</strong></article>
        <article class="card"><span>Cheltuieli</span><strong id="expense-total">0 RON</strong></article>
        <article class="card"><span>Sold</span><strong id="balance-total">0 RON</strong></article>
        <article class="card"><span>Buget rămas</span><strong id="budget-left">0 RON</strong></article>
      </section>

      <section class="grid">
        <form id="budget-form" class="panel">
          <h2>Buget lunar</h2>
          <label for="monthly-budget">Suma bugetului</label>
          <input id="monthly-budget" type="number" min="0" step="0.01" placeholder="ex. 2500" />
          <button type="submit">Setează buget</button>
          <p id="budget-error" class="error"></p>
        </form>

        <form id="transaction-form" class="panel">
          <h2>Adaugă tranzacție</h2>

          <label for="description">Descriere</label>
          <input id="description" maxlength="60" placeholder="ex. salariu, chirie, cafea" />

          <label for="amount">Sumă</label>
          <input id="amount" type="number" min="0.01" step="0.01" placeholder="ex. 120.50" />

          <label for="type">Tip</label>
          <select id="type">
            <option value="income">Venit</option>
            <option value="expense">Cheltuială</option>
          </select>

          <label for="category">Categorie</label>
          <select id="category">
            <option value="salary">Salariu</option>
            <option value="food">Mâncare</option>
            <option value="rent">Chirie</option>
            <option value="transport">Transport</option>
            <option value="health">Sănătate</option>
            <option value="other">Altele</option>
          </select>

          <label for="date">Dată</label>
          <input id="date" type="date" />

          <button type="submit">Adaugă</button>
          <p id="transaction-error" class="error"></p>
        </form>
      </section>

      <section class="panel">
        <div class="toolbar">
          <h2>Tranzacții</h2>
          <div class="filters">
            <input id="search" placeholder="Caută descriere..." />
            <select id="filter-type">
              <option value="all">Toate</option>
              <option value="income">Venituri</option>
              <option value="expense">Cheltuieli</option>
            </select>
            <select id="filter-category">
              <option value="all">Toate categoriile</option>
              <option value="salary">Salariu</option>
              <option value="food">Mâncare</option>
              <option value="rent">Chirie</option>
              <option value="transport">Transport</option>
              <option value="health">Sănătate</option>
              <option value="other">Altele</option>
            </select>
          </div>
        </div>

        <ul id="transaction-list" class="transactions"></ul>
        <p id="empty-state" class="empty">Nu există tranzacții.</p>
      </section>
    </main>

    <script src="src/budget.js"></script>
    <script src="src/storage.js"></script>
    <script src="src/app.js"></script>
  </body>
</html>
